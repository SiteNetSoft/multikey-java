name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  jvm:
    name: JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -T 8 verify
